# 一次性扫描任务：跑完即退出（不是常驻服务）
# make apply 会自动替换 TPIMAGE_VERSION 并重建 Job
apiVersion: batch/v1
kind: Job
metadata:
  name: token-issue-stat-task
  namespace: tp-bserver
  labels:
    k8s-app: token-issue-stat-task
spec:
  backoffLimit: 1              # 失败最多重试 1 次（续扫靠 checkpoint）
  ttlSecondsAfterFinished: 86400  # 完成后保留 1 天便于看日志
  template:
    metadata:
      labels:
        srv: token-issue-stat-task
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: tp-hk-registry-gb
      containers:
        - name: token-issue-stat-task
          image: registry-intl.cn-hongkong.aliyuncs.com/tokenpocketgb/token-issue-stat-task:TPIMAGE_VERSION
          imagePullPolicy: "Always"
          volumeMounts:
            - name: configmap-volume
              mountPath: /home/tokenbank/token-issue-stat-task/config/config_prod.yml
              subPath: config_prod.yml
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "0.2"
              memory: "200Mi"
      volumes:
        - name: configmap-volume
          configMap:
            name: config-token-issue-stat-task-prod
            items:
              - key: config_prod.yml
                path: config_prod.yml
